org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Sakhi is Java only: without this, the Android plugin 9 adds Kotlin's standard library (2 MB) to the app.
android.builtInKotlin=false
# Never download SDK parts during a build: install them on purpose (README.txt), as the licences need accepting.
android.builder.sdkDownload=false
# The Play build reads the upload key's password from the environment: never keep it in Gradle's cache on disk.
org.gradle.configuration-cache=false
