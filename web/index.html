<script id="sakhi-theme-boot">/* her saved look before the first paint: light unless she chose dark or "same as phone" */ try { var q = JSON.parse(localStorage.getItem('qura-saathi-v1') || '{}'); var th = (q.settings && q.settings.theme) || 'light'; if (th !== 'system') document.documentElement.setAttribute('data-theme', th); } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }</script>

:root[data-theme="dark"] body { background: #1E1414; }
/* Version 32: if the app never starts (a very old WebView), this note shows after 6 seconds; a normal start replaces it */
.boot-note { opacity: 0; animation: boot-note 0.3s 6s forwards; padding: 24px 16px; font: 16px/1.5 sans-serif; color: #2B1414; }
:root[data-theme="dark"] .boot-note { color: #F5E8E8; }
@keyframes boot-note { to { opacity: 1; } }
